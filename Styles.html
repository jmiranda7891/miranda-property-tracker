<style>
  :root {
    --navy: #1f2d3d;
    --navy-light: #34495e;
    --gold: #b8935a;
    --gold-light: #e8d5b7;
    --bg: #f6f4ef;
    --card-bg: #ffffff;
    --border: #e0dcd2;
    --text: #2a2a2a;
    --text-muted: #6b6b6b;
    --danger: #b23b3b;
    --danger-bg: #fbe9e9;
    --ok: #3a7a4e;
    --ok-bg: #e8f3ea;
    --warn: #a67c1f;
    --warn-bg: #fbf1dd;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  #app { min-height: 100vh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--navy-light); }

  .center-msg {
    display: flex; align-items: center; justify-content: center;
    min-height: 60vh; text-align: center; padding: 2rem; color: var(--text-muted);
  }

  .topbar {
    display: flex; align-items: center; gap: .75rem;
    padding: .75rem 1.25rem; background: var(--navy); color: #fff;
    position: sticky; top: 0; z-index: 20; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 1.05rem; font-weight: 600; margin: 0; letter-spacing: .2px; }
  .topbar .spacer { flex: 1; }
  .topbar .who { font-size: .82rem; opacity: .85; margin-right: .5rem; }
  .role-badge {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;
    background: var(--gold); color: #2a2210; padding: .15rem .5rem; border-radius: 999px; font-weight: 700;
  }
  .lang-toggle {
    display: flex; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; overflow: hidden;
  }
  .lang-toggle button {
    background: transparent; border: none; color: #fff; padding: .3rem .7rem; cursor: pointer; font-size: .78rem; font-weight: 600;
  }
  .lang-toggle button.active { background: var(--gold); color: #2a2210; }

  .btn {
    border: 1px solid transparent; border-radius: 7px; padding: .45rem .9rem;
    cursor: pointer; font-weight: 600; font-size: .85rem; white-space: nowrap;
  }
  .btn-primary { background: var(--gold); color: #2a2210; }
  .btn-primary:hover { background: #a8824c; }
  .btn-ghost { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.3); }
  .btn-ghost:hover { background: rgba(255,255,255,.2); }
  .btn-light { background: #fff; color: var(--navy); border-color: var(--border); }
  .btn-light:hover { background: #f0eee8; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #922f2f; }
  .btn-outline-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn-outline-danger:hover { background: var(--danger-bg); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-sm { padding: .3rem .6rem; font-size: .78rem; }

  .main { max-width: 1200px; margin: 0 auto; padding: 1.25rem; }

  .summary-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: .75rem; margin-bottom: 1.25rem;
  }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: .85rem 1rem; box-shadow: var(--shadow);
  }
  .stat-card .num { font-size: 1.5rem; font-weight: 700; color: var(--navy); }
  .stat-card .lbl { font-size: .75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; }

  .filter-bar {
    display: flex; flex-wrap: wrap; gap: .6rem; align-items: center;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: .75rem; margin-bottom: 1rem; box-shadow: var(--shadow);
  }
  .filter-bar select, .filter-bar input[type="text"] {
    padding: .4rem .6rem; border: 1px solid var(--border); border-radius: 6px; background: #fff;
  }
  .filter-bar input[type="text"] { min-width: 180px; flex: 1; }
  .filter-bar label.chk { display: flex; align-items: center; gap: .35rem; font-size: .85rem; color: var(--text-muted); }

  .card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .9rem;
  }
  .prop-card {
    background: var(--card-bg); border: 1px solid var(--border); border-left: 4px solid var(--border);
    border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow);
    cursor: pointer; transition: box-shadow .15s, transform .15s;
  }
  .prop-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.1); transform: translateY(-1px); }
  .prop-card.archived { opacity: .6; }
  .prop-card.accent-en_uso { border-left-color: var(--ok); }
  .prop-card.accent-en_venta { border-left-color: var(--warn); }
  .prop-card.accent-vendida { border-left-color: #2a5fa0; }
  .prop-card.accent-libre { border-left-color: #999; }
  .prop-card.accent-archived { border-left-color: #999; }
  .prop-card h3 { margin: .35rem 0 .2rem; font-size: 1.02rem; color: var(--navy); }
  .prop-card .sub { color: var(--text-muted); font-size: .82rem; margin-bottom: .5rem; }
  .prop-card .price { font-weight: 700; font-size: 1.15rem; color: var(--navy); margin-bottom: .4rem; }
  .prop-card .flag { color: var(--warn); font-size: .75rem; }
  .chip-country {
    display: inline-block; font-size: .65rem; font-weight: 700; letter-spacing: .03em;
    color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px;
    padding: .05rem .35rem; margin-right: .35rem; vertical-align: middle;
  }
  .card-footer {
    margin-top: .6rem; padding-top: .5rem; border-top: 1px dashed var(--border);
    display: flex; justify-content: flex-end;
  }
  .card-maps-link { font-size: .78rem; color: var(--navy-light); text-decoration: none; font-weight: 600; }
  .card-maps-link:hover { text-decoration: underline; }

  .badge {
    display: inline-block; font-size: .68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .03em; padding: .18rem .5rem; border-radius: 999px;
  }
  .badge-en_uso { background: var(--ok-bg); color: var(--ok); }
  .badge-en_venta { background: var(--warn-bg); color: var(--warn); }
  .badge-vendida { background: #e6f0fb; color: #2a5fa0; }
  .badge-libre { background: #eee; color: #777; }
  .badge-ejido { background: #efe6f5; color: #6a3d8f; }
  .badge-archived { background: #eee; color: #777; }

  .empty-state { text-align: center; color: var(--text-muted); padding: 3rem 1rem; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,20,20,.45); z-index: 50;
    display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 2.5rem 1rem;
  }
  .modal {
    background: #fff; border-radius: var(--radius); max-width: 640px; width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,.25); animation: pop .12s ease-out;
  }
  @keyframes pop { from { transform: scale(.98); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-header {
    display: flex; align-items: center; gap: .5rem; padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h2 { margin: 0; font-size: 1.05rem; flex: 1; color: var(--navy); }
  .modal-close { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-muted); line-height: 1; }
  .modal-body { padding: 1.1rem 1.25rem; max-height: 70vh; overflow-y: auto; }
  .modal-footer {
    display: flex; gap: .5rem; justify-content: flex-end; padding: 1rem 1.25rem;
    border-top: 1px solid var(--border); flex-wrap: wrap;
  }

  .field-group { margin-bottom: 1rem; }
  .field-group h4 {
    margin: 0 0 .5rem; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
    color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: .3rem;
  }
  .field-row { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: .5rem; }
  .field { flex: 1; min-width: 140px; }
  .field label { display: block; font-size: .75rem; color: var(--text-muted); margin-bottom: .2rem; }
  .field input, .field select, .field textarea {
    width: 100%; padding: .45rem .55rem; border: 1px solid var(--border); border-radius: 6px; background: #fff;
  }
  .field textarea { resize: vertical; min-height: 3.2em; }
  .kv { display: flex; justify-content: space-between; gap: 1rem; padding: .25rem 0; border-bottom: 1px dashed var(--border); font-size: .88rem; }
  .kv .k { color: var(--text-muted); }
  .kv .v { text-align: right; font-weight: 500; }
  .prose { font-size: .88rem; color: var(--text); white-space: pre-wrap; }
  .audit-footer { font-size: .75rem; color: var(--text-muted); margin-top: .5rem; }
  .maps-link {
    display: inline-flex; align-items: center; gap: .3rem; font-size: .85rem; font-weight: 600;
    color: var(--navy-light); text-decoration: none;
  }
  .maps-link:hover { text-decoration: underline; }

  .confirm-danger { background: var(--danger-bg); border: 1px solid #eecccc; border-radius: 8px; padding: .75rem; margin-top: .5rem; }
  .confirm-danger input { margin-top: .4rem; }

  .admin-tabs { display: flex; gap: .4rem; margin-bottom: 1rem; }
  .admin-tabs button.tab {
    background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: .4rem 1rem;
    cursor: pointer; font-size: .82rem; font-weight: 600; color: var(--text-muted);
  }
  .admin-tabs button.tab.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  table.admin-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  table.admin-table th, table.admin-table td { padding: .55rem .7rem; text-align: left; border-bottom: 1px solid var(--border); font-size: .85rem; }
  table.admin-table th { background: #f0eee8; color: var(--text-muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .03em; }
  .add-user-form { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .add-user-form input, .add-user-form select { padding: .4rem .6rem; border: 1px solid var(--border); border-radius: 6px; }
  .pins-hint { color: var(--text-muted); font-size: .85rem; margin: 0 0 .75rem; }
  .pins-summary { font-size: .85rem; font-weight: 600; margin: .75rem 0; color: var(--navy); }
  .pins-subnote { font-size: .72rem; color: var(--warn); margin-top: .15rem; }
  tr.pin-fail td { background: var(--danger-bg); }
  tr.pin-warn td { background: var(--warn-bg); }

  .table-scroll {
    overflow-x: auto; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }

  .map-container {
    position: relative; z-index: 1;
    height: 65vh; min-height: 360px; border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .map-container .leaflet-popup-content a { color: var(--navy-light); font-weight: 600; }
  table.prop-table { width: 100%; border-collapse: collapse; font-size: .83rem; white-space: nowrap; }
  table.prop-table thead th {
    position: sticky; top: 0; background: #f0eee8; color: var(--text-muted);
    font-size: .7rem; text-transform: uppercase; letter-spacing: .03em;
    padding: .55rem .65rem; text-align: left; border-bottom: 1px solid var(--border);
  }
  table.prop-table thead th.sortable { cursor: pointer; user-select: none; }
  table.prop-table thead th.sortable:hover { background: #e7e3d8; }
  tr.filter-row th { background: #fff; padding: .3rem .5rem; border-bottom: 1px solid var(--border); font-weight: 400; }
  .col-filter, .col-filter-num { width: 100%; box-sizing: border-box; padding: .3rem .4rem; font-size: .78rem; border: 1px solid var(--border); border-radius: 4px; }
  .col-filter-range { display: flex; gap: .25rem; }
  .col-filter-range .col-filter-num { width: 50%; }
  td.empty-filtered { text-align: center; color: var(--text-muted); padding: 1.2rem; white-space: normal; }
  .list-filter-bar { margin-bottom: .5rem; }
  table.prop-table thead th .sort-arrow { margin-left: .25rem; opacity: .8; }
  table.prop-table tbody td { padding: .45rem .65rem; border-bottom: 1px solid var(--border); }
  table.prop-table tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.prop-table tbody tr { cursor: pointer; }
  table.prop-table tbody tr:nth-child(even) { background: #faf9f6; }
  table.prop-table tbody tr:hover { background: #f0eee8; }
  table.prop-table tbody tr.archived { opacity: .55; }

  .toast {
    position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
    background: var(--navy); color: #fff; padding: .6rem 1.1rem; border-radius: 999px;
    font-size: .85rem; box-shadow: var(--shadow); z-index: 100;
  }
  .toast.error { background: var(--danger); }

  @media (max-width: 640px) {
    .topbar { padding: .6rem .8rem; }
    .topbar h1 { display: none; }
    .main { padding: .8rem; }
    .card-grid { grid-template-columns: 1fr; }
    .table-scroll { -webkit-overflow-scrolling: touch; }
    .modal-backdrop { padding: 0; align-items: stretch; }
    .modal { max-width: none; width: 100%; min-height: 100vh; border-radius: 0; }
  }
</style>
